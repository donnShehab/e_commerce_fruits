name: e_coomerce_fruit
description: "A new Flutter project."
publish_to: 'none' # لمنع النشر على pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  animate_do: ^3.3.4
  cached_network_image: ^3.4.1
  cloud_firestore: ^6.0.1
  connectivity_plus: ^7.0.0
  cupertino_icons: ^1.0.8
  dartz: ^0.10.1
  dots_indicator: ^4.0.1
  equatable: ^2.0.7
  firebase_auth: ^6.0.1
  firebase_core: ^4.2.0
  firebase_storage: ^13.0.3
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_facebook_auth: ^7.1.2
  flutter_localization: ^0.3.3
  flutter_localizations:
    sdk: flutter
  flutter_paypal_payment: ^1.0.8
  flutter_svg: ^2.2.0
  flutter_svg_provider: ^1.0.7
  font_awesome_flutter: ^10.9.0
  get_it: ^8.2.0
  go_router: ^16.1.0
  google_sign_in: ^6.2.1
  intl: ^0.20.2
  modal_progress_hud_nsn: ^0.5.1
  provider: ^6.1.5+1
  shared_preferences: ^2.5.3
  skeletonizer: ^2.1.0+1
  uuid: ^4.5.2

dev_dependencies:
  flutter_launcher_icons: "^0.14.4"

  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/images/
    - assets/images/vuesax/bold/
    - assets/images/vuesax/otline/

  fonts:
    - family: Cario
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon.jpg"
  min_sdk_android: 21

flutter_assets:
  assets_path: assets/images/
  output_path: lib/core/utils/
  filename: app_images.dart
  field_prefix: null

flutter_intl:
  enabled: true
